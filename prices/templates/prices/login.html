{% extends "prices/base.html" %}
{% block title %}Kirish — Narx kuzatuvchi{% endblock %}
{% block content %}
<section class="card narrow">
  <h2>Kirish</h2>
  {% if form.errors %}<p class="error">Login yoki parol noto'g'ri.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Login<input name="username" autocomplete="username" required autofocus></label>
    <label>Parol<input name="password" type="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next|default:'/' }}">
    <button class="btn primary" type="submit">Kirish</button>
  </form>
  <p class="muted">Hisobingiz yo'qmi? <a href="/signup/?next={{ next|default:'/'|urlencode }}">Ro'yxatdan o'ting</a></p>
  <p class="muted"><a href="/">← Bosh sahifa</a></p>
</section>
{% endblock %}
